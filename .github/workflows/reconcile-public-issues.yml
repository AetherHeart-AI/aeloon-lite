name: Reconcile public issues

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional public Issue number to replay immediately
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: reconcile-public-issues
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile public issue completion
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create three-repository Issue token
        id: issue-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AELOON_ISSUE_APP_ID }}
          private-key: ${{ secrets.AELOON_ISSUE_APP_PRIVATE_KEY }}
          owner: AetherHeart-AI
          repositories: |
            aeloon-lite
            aeloon-lite-ui
            aeloon-lite-runtime

      - name: Reconcile merge-closed work items
        shell: bash
        env:
          ISSUE_GH_TOKEN: ${{ steps.issue-app.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ -n "$ISSUE_NUMBER" ]]; then
            [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo "issue_number must be a positive integer." >&2
              exit 2
            }
            python3 tools/issue_flow.py reconcile --issue "$ISSUE_NUMBER"
          else
            python3 tools/issue_flow.py reconcile
          fi
