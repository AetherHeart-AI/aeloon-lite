name: Repair official OSS release mirror

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public distribution Release tag, such as v0.4.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: oss-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      AELOON_OSS_ROLE_ARN: ${{ vars.AELOON_OSS_ROLE_ARN }}
      AELOON_OSS_OIDC_PROVIDER_ARN: ${{ vars.AELOON_OSS_OIDC_PROVIDER_ARN }}
      AELOON_OSS_ENDPOINT: https://oss-accelerate.aliyuncs.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified ossutil
        run: bash tools/setup_ossutil.sh
      - name: Check ossutil CRC-64 interface
        run: |
          printf aeloon > "$RUNNER_TEMP/aeloon-hash-smoke"
          python3 -c 'import os; from pathlib import Path; from tools.oss_mirror import Oss; print(Oss().local_crc64(Path(os.environ["RUNNER_TEMP"]) / "aeloon-hash-smoke"))'
      - name: Verify GitHub assets and fill missing OSS objects
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/oss_mirror.py release --tag "$RELEASE_TAG"
      - name: Publish current stable channel pointers
        run: python3 tools/oss_mirror.py channels --directory channels
