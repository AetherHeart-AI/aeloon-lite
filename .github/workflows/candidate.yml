name: Prepare Desktop test candidate

on:
  repository_dispatch:
    types: [publish-desktop]
  workflow_dispatch:
    inputs:
      version:
        description: Desktop semantic version to stage for testing
        required: true
        type: string
      platform:
        description: Platform assets to include in the test candidate
        required: true
        default: all
        type: choice
        options: [all, macos-arm64, linux-arm64, linux-x86_64]

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.event.client_payload.version || inputs.version }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Stage Desktop ${{ github.event.client_payload.version || inputs.version }} (${{ inputs.platform || 'all' }}) without a Release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download and verify the immutable Desktop source assets
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          INPUT_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          INPUT_PLATFORM: ${{ inputs.platform || 'all' }}
          INPUT_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "AELOON_RELEASE_TOKEN is required." >&2; exit 1; }
          version="$INPUT_VERSION"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 2
          platform="$INPUT_PLATFORM"
          repository="AetherHeart-AI/aeloon-lite-ui"
          tag="v$version"
          source_commit="$(gh api "repos/$repository/commits/$tag" --jq .sha)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$INPUT_SOURCE_COMMIT" && "$INPUT_SOURCE_COMMIT" != "$source_commit" ]]; then
            echo "Dispatch source commit does not match $tag." >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/desktop-source-release.json"
          gh api "repos/$repository/releases/tags/$tag" > "$release_json"
          expected=(
            "aeloon-lite-$version-arm64.deb"
            "aeloon-lite-$version-arm64.dmg"
            "aeloon-lite-$version-arm64.rpm"
            "aeloon-lite-$version-x86_64.deb"
            "aeloon-lite-$version-x86_64.rpm"
          )
          case "$platform" in
            all) selected=("${expected[@]}") ;;
            macos-arm64) selected=("aeloon-lite-$version-arm64.dmg") ;;
            linux-arm64)
              selected=("aeloon-lite-$version-arm64.deb" "aeloon-lite-$version-arm64.rpm")
              ;;
            linux-x86_64)
              selected=("aeloon-lite-$version-x86_64.deb" "aeloon-lite-$version-x86_64.rpm")
              ;;
            *) echo "Invalid candidate platform: $platform" >&2; exit 2 ;;
          esac
          mapfile -t actual < <(jq -r '.assets[].name' "$release_json" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]] || {
            echo "Desktop source Release $tag has an unexpected asset set." >&2
            exit 1
          }
          jq -e '(.draft == false) and (.prerelease == false) and all(.assets[]; .digest | test("^sha256:[a-f0-9]{64}$"))' \
            "$release_json" >/dev/null

          candidate_dir="$RUNNER_TEMP/desktop-candidate"
          mkdir -p "$candidate_dir"
          for name in "${selected[@]}"; do
            gh release download "$tag" --repo "$repository" --pattern "$name" --dir "$candidate_dir"
            digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' "$release_json")"
            actual_digest="sha256:$(sha256sum "$candidate_dir/$name" | cut -d ' ' -f1)"
            [[ "$actual_digest" == "$digest" ]] || {
              echo "Candidate asset digest does not match the source Release: $name" >&2
              exit 1
            }
          done

          selected_json="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -s .)"
          jq --arg version "$version" --arg repository "$repository" --arg tag "$tag" \
            --arg commit "$source_commit" --arg run_id "$GITHUB_RUN_ID" --arg platform "$platform" \
            --argjson selected "$selected_json" \
            '{
              schemaVersion: 1,
              product: "desktop",
              platform: $platform,
              version: $version,
              source: {repository: $repository, tag: $tag, commit: $commit},
              candidateRunId: $run_id,
              assets: [.assets[] | select(.name as $name | $selected | index($name)) | {name, size, digest}]
            }' "$release_json" > "$candidate_dir/candidate.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_dir=$candidate_dir" >> "$GITHUB_OUTPUT"

      - name: Upload the downloadable test candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aeloon-lite-desktop-v${{ steps.candidate.outputs.version }}-candidate-${{ steps.candidate.outputs.platform }}
          path: ${{ steps.candidate.outputs.candidate_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
