name: Benchmark OSS upload endpoints

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: oss-upload-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      AELOON_OSS_ROLE_ARN: ${{ vars.AELOON_OSS_ROLE_ARN }}
      AELOON_OSS_OIDC_PROVIDER_ARN: ${{ vars.AELOON_OSS_OIDC_PROVIDER_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified ossutil
        run: bash tools/setup_ossutil.sh
      - name: Measure and abort multipart uploads
        run: python3 tools/benchmark_oss_upload.py
