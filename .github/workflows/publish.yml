name: Publish stable release

on:
  repository_dispatch:
    types: [publish-runtime, publish-desktop]
  workflow_dispatch:
    inputs:
      product:
        description: Product to publish
        required: true
        type: choice
        options:
          - runtime
          - desktop
      version:
        description: Stable semantic version to replay
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: distribution-publish-${{ github.event.client_payload.product || inputs.product }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.product || inputs.product }} ${{ github.event.client_payload.version || inputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify source Release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          INPUT_PRODUCT: ${{ github.event.client_payload.product || inputs.product }}
          INPUT_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "AELOON_RELEASE_TOKEN is required." >&2
            exit 1
          }

          product="$INPUT_PRODUCT"
          version="$INPUT_VERSION"
          source_commit="$INPUT_SOURCE_COMMIT"
          case "$product" in
            runtime)
              source_repository="AetherHeart-AI/aeloon-lite-runtime"
              source_tag="runtime-v$version"
              expected=(
                "aeloon-runtime-darwin-aarch64.tar.zst"
                "aeloon-runtime-linux-aarch64.tar.gz"
                "aeloon-runtime-linux-aarch64.tar.zst"
                "aeloon-runtime-linux-x86_64.tar.gz"
                "aeloon-runtime-linux-x86_64.tar.zst"
              )
              ;;
            desktop)
              source_repository="AetherHeart-AI/aeloon-lite-ui"
              source_tag="v$version"
              expected=(
                "aeloon-lite-$version-arm64.deb"
                "aeloon-lite-$version-arm64.dmg"
                "aeloon-lite-$version-arm64.rpm"
                "aeloon-lite-$version-x86_64.deb"
                "aeloon-lite-$version-x86_64.rpm"
              )
              ;;
            *)
              echo "Invalid product: $product" >&2
              exit 2
              ;;
          esac
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Only stable semantic versions are supported: $version" >&2
            exit 2
          }

          release_commit="$(gh api "repos/$source_repository/commits/$source_tag" --jq .sha)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Could not resolve the source tag $source_tag to a commit." >&2
            exit 1
          }
          if [[ -n "$source_commit" && "$source_commit" != "$release_commit" ]]; then
            echo "Dispatch source commit does not match $source_tag." >&2
            echo "Dispatch: $source_commit" >&2
            echo "Tag:      $release_commit" >&2
            exit 1
          fi
          source_commit="$release_commit"

          asset_dir="$RUNNER_TEMP/source-release"
          mkdir -p "$asset_dir"
          gh release download "$source_tag" \
            --repo "$source_repository" \
            --pattern '*' \
            --dir "$asset_dir" \
            --clobber

          expected_files="$RUNNER_TEMP/expected-source-files"
          actual_files="$RUNNER_TEMP/actual-source-files"
          checksum_names="$RUNNER_TEMP/checksum-names"
          printf '%s\n' "${expected[@]}" SHA256SUMS | sort > "$expected_files"
          find "$asset_dir" -maxdepth 1 -type f -printf '%f\n' | sort > "$actual_files"
          diff -u "$expected_files" "$actual_files"

          checksums="$asset_dir/SHA256SUMS"
          grep -Fx '# aeloon-release-v1' "$checksums"
          grep -Fx "# product=$product" "$checksums"
          grep -Fx "# version=$version" "$checksums"
          grep -Fx "# source=$source_repository@$source_commit" "$checksums"
          grep -Ev '^(#|$)' "$checksums" | awk '{print $2}' | sort > "$checksum_names"
          printf '%s\n' "${expected[@]}" | sort | diff -u - "$checksum_names"
          (
            cd "$asset_dir"
            sha256sum -c SHA256SUMS
          )

          publish_dir="$RUNNER_TEMP/publish-assets"
          mkdir -p "$publish_dir"
          for name in "${expected[@]}"; do
            cp "$asset_dir/$name" "$publish_dir/$name"
          done
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Publish distribution release and stable channel
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          PRODUCT: ${{ steps.source.outputs.product }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          ASSET_DIR: ${{ steps.source.outputs.asset_dir }}
        run: |
          set -euo pipefail
          tools/publish_release.sh \
            --product "$PRODUCT" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --asset-dir "$ASSET_DIR"

      - name: Notify Desktop Runtime-lock workflow
        if: steps.source.outputs.product == 'runtime'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "AELOON_RELEASE_TOKEN is required for Runtime releases." >&2
            exit 1
          }
          gh api --method POST repos/AetherHeart-AI/aeloon-lite-ui/dispatches \
            -f event_type=runtime-release \
            -f "client_payload[release_tag]=runtime-v${VERSION}"
