name: Publish official release

on:
  repository_dispatch:
    types: [publish-runtime]
  workflow_dispatch:
    inputs:
      product:
        description: Official source release to publish or replay
        required: true
        type: choice
        options: [runtime, desktop]
      version:
        description: Stable semantic version to publish or replay
        required: true
        type: string
      candidate_run_id:
        description: Successful Desktop candidate run ID (required for a new Desktop Release)
        required: false
        type: string
      summary_zh:
        description: Chinese official-release summary (required for Desktop)
        required: false
        type: string
      summary_en:
        description: English official-release summary (required for Desktop)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: distribution-publish-${{ github.event.client_payload.product || inputs.product }}
  cancel-in-progress: false

jobs:
  publish:
    name: Process ${{ github.event.client_payload.product || inputs.product }} ${{ github.event.client_payload.version || inputs.version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create three-repository Issue token
        id: issue-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AELOON_ISSUE_APP_ID }}
          private-key: ${{ secrets.AELOON_ISSUE_APP_PRIVATE_KEY }}
          owner: AetherHeart-AI
          repositories: |
            aeloon-lite
            aeloon-lite-ui
            aeloon-lite-runtime

      - name: Reconcile completed public Issues
        env:
          ISSUE_GH_TOKEN: ${{ steps.issue-app.outputs.token }}
        run: python3 tools/issue_flow.py reconcile

      - name: Resolve source Release
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          INPUT_PRODUCT: ${{ github.event.client_payload.product || inputs.product }}
          INPUT_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          INPUT_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "AELOON_RELEASE_TOKEN is required." >&2; exit 1; }
          product="$INPUT_PRODUCT"
          version="$INPUT_VERSION"
          source_commit="$INPUT_SOURCE_COMMIT"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 2
          case "$product" in
            runtime)
              source_repository="AetherHeart-AI/aeloon-lite-runtime"
              source_tag="runtime-v$version"
              expected=(
                aeloon-runtime-darwin-aarch64.tar.zst
                aeloon-runtime-linux-aarch64.tar.gz
                aeloon-runtime-linux-aarch64.tar.zst
                aeloon-runtime-linux-x86_64.tar.gz
                aeloon-runtime-linux-x86_64.tar.zst
              )
              ;;
            desktop)
              source_repository="AetherHeart-AI/aeloon-lite-ui"
              source_tag="v$version"
              expected=(
                "aeloon-lite-$version-arm64.deb"
                "aeloon-lite-$version-arm64.dmg"
                "aeloon-lite-$version-arm64.rpm"
                "aeloon-lite-$version-x86_64.deb"
                "aeloon-lite-$version-x86_64.rpm"
              )
              ;;
            *) echo "Invalid product: $product" >&2; exit 2 ;;
          esac
          release_commit="$(gh api "repos/$source_repository/commits/$source_tag" --jq .sha)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [[ -n "$source_commit" && "$source_commit" != "$release_commit" ]]; then
            echo "Dispatch source commit does not match $source_tag." >&2
            exit 1
          fi
          mapfile -t actual < <(gh release view "$source_tag" --repo "$source_repository" \
            --json assets --jq '.assets[].name' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]] || {
            echo "Source Release $source_tag has an unexpected asset set." >&2
            exit 1
          }
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Download the tested Desktop candidate and pinned Runtime assets
        if: steps.source.outputs.product == 'desktop'
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          ISSUE_GH_TOKEN: ${{ steps.issue-app.outputs.token }}
          DESKTOP_VERSION: ${{ steps.source.outputs.version }}
          DESKTOP_COMMIT: ${{ steps.source.outputs.source_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SUMMARY_ZH: ${{ inputs.summary_zh }}
          SUMMARY_EN: ${{ inputs.summary_en }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "A successful Desktop candidate run ID is required for an official Release." >&2
            exit 2
          }
          test -n "$SUMMARY_ZH" || { echo "A Chinese official-release summary is required." >&2; exit 2; }
          test -n "$SUMMARY_EN" || { echo "An English official-release summary is required." >&2; exit 2; }

          asset_dir="$RUNNER_TEMP/unified-assets"
          mkdir -p "$asset_dir"
          candidate_dir="$RUNNER_TEMP/desktop-candidate"
          mkdir -p "$candidate_dir"
          gh run download "$CANDIDATE_RUN_ID" --repo AetherHeart-AI/aeloon-lite \
            --name "aeloon-lite-desktop-v${DESKTOP_VERSION}-candidate-all" --dir "$candidate_dir"
          candidate_manifest="$(find "$candidate_dir" -type f -name candidate.json -print -quit)"
          test -n "$candidate_manifest" || { echo "Candidate manifest is missing." >&2; exit 1; }
          test "$(jq -r .schemaVersion "$candidate_manifest")" = 1
          test "$(jq -r .product "$candidate_manifest")" = desktop
          test "$(jq -r .platform "$candidate_manifest")" = all
          test "$(jq -r .version "$candidate_manifest")" = "$DESKTOP_VERSION"
          test "$(jq -r .source.repository "$candidate_manifest")" = AetherHeart-AI/aeloon-lite-ui
          test "$(jq -r .source.tag "$candidate_manifest")" = "v$DESKTOP_VERSION"
          test "$(jq -r .source.commit "$candidate_manifest")" = "$DESKTOP_COMMIT"
          test "$(jq -r .candidateRunId "$candidate_manifest")" = "$CANDIDATE_RUN_ID"
          expected_desktop=(
            "aeloon-lite-$DESKTOP_VERSION-arm64.deb"
            "aeloon-lite-$DESKTOP_VERSION-arm64.dmg"
            "aeloon-lite-$DESKTOP_VERSION-arm64.rpm"
            "aeloon-lite-$DESKTOP_VERSION-x86_64.deb"
            "aeloon-lite-$DESKTOP_VERSION-x86_64.rpm"
          )
          mapfile -t candidate_names < <(jq -r '.assets[].name' "$candidate_manifest" | sort)
          mapfile -t wanted_desktop < <(printf '%s\n' "${expected_desktop[@]}" | sort)
          [[ "${candidate_names[*]}" == "${wanted_desktop[*]}" ]] || {
            echo "Candidate manifest has an unexpected Desktop asset set." >&2
            exit 1
          }
          for name in "${expected_desktop[@]}"; do
            candidate_asset="$(find "$candidate_dir" -type f -name "$name" -print -quit)"
            test -n "$candidate_asset" || { echo "Candidate asset is missing: $name" >&2; exit 1; }
            expected_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' "$candidate_manifest")"
            actual_digest="sha256:$(sha256sum "$candidate_asset" | cut -d ' ' -f1)"
            [[ "$actual_digest" == "$expected_digest" ]] || {
              echo "Candidate asset failed digest verification: $name" >&2
              exit 1
            }
            cp "$candidate_asset" "$asset_dir/$name"
          done

          lock="$RUNNER_TEMP/runtime-bundle.lock.json"
          gh api "repos/AetherHeart-AI/aeloon-lite-ui/contents/runtime-bundle.lock.json?ref=$DESKTOP_COMMIT" \
            --jq .content | base64 --decode > "$lock"
          runtime_version="$(jq -r .runtime.version "$lock")"
          runtime_commit="$(jq -r .runtime.commit "$lock")"
          runtime_tag="runtime-v$runtime_version"
          [[ "$runtime_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$runtime_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/AetherHeart-AI/aeloon-lite-runtime/commits/$runtime_tag" --jq .sha)" = "$runtime_commit"
          expected_runtime=(
            aeloon-runtime-darwin-aarch64.tar.zst
            aeloon-runtime-linux-aarch64.tar.gz
            aeloon-runtime-linux-aarch64.tar.zst
            aeloon-runtime-linux-x86_64.tar.gz
            aeloon-runtime-linux-x86_64.tar.zst
          )
          mapfile -t actual_runtime < <(gh release view "$runtime_tag" \
            --repo AetherHeart-AI/aeloon-lite-runtime --json assets --jq '.assets[].name' | sort)
          mapfile -t wanted_runtime < <(printf '%s\n' "${expected_runtime[@]}" | sort)
          [[ "${actual_runtime[*]}" == "${wanted_runtime[*]}" ]] || {
            echo "Runtime source Release $runtime_tag has an unexpected asset set." >&2
            exit 1
          }
          gh release download "$runtime_tag" --repo AetherHeart-AI/aeloon-lite-runtime \
            --pattern 'aeloon-runtime-*' --dir "$asset_dir"
          echo "runtime_version=$runtime_version" >> "$GITHUB_OUTPUT"
          echo "runtime_commit=$runtime_commit" >> "$GITHUB_OUTPUT"
          echo "asset_dir=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Publish unified distribution Release
        if: steps.source.outputs.product == 'desktop'
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          ISSUE_GH_TOKEN: ${{ steps.issue-app.outputs.token }}
          DESKTOP_VERSION: ${{ steps.source.outputs.version }}
          DESKTOP_COMMIT: ${{ steps.source.outputs.source_commit }}
          RUNTIME_VERSION: ${{ steps.assets.outputs.runtime_version }}
          RUNTIME_COMMIT: ${{ steps.assets.outputs.runtime_commit }}
          ASSET_DIR: ${{ steps.assets.outputs.asset_dir }}
          SUMMARY_ZH: ${{ inputs.summary_zh }}
          SUMMARY_EN: ${{ inputs.summary_en }}
        run: |
          tools/publish_release.sh \
            --desktop-version "$DESKTOP_VERSION" --desktop-source-commit "$DESKTOP_COMMIT" \
            --runtime-version "$RUNTIME_VERSION" --runtime-source-commit "$RUNTIME_COMMIT" \
            --summary-zh "$SUMMARY_ZH" --summary-en "$SUMMARY_EN" \
            --asset-dir "$ASSET_DIR"

      - name: Publish public Runtime assets for SSH deployment
        if: steps.source.outputs.product == 'runtime'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          ISSUE_GH_TOKEN: ${{ steps.issue-app.outputs.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: |
          set -euo pipefail
          tag="runtime-v$VERSION"
          asset_dir="$RUNNER_TEMP/runtime-assets"
          mkdir -p "$asset_dir"
          gh release download "$tag" --repo AetherHeart-AI/aeloon-lite-runtime \
            --pattern 'aeloon-runtime-*' --dir "$asset_dir"
          expected=(
            aeloon-runtime-darwin-aarch64.tar.zst
            aeloon-runtime-linux-aarch64.tar.gz
            aeloon-runtime-linux-aarch64.tar.zst
            aeloon-runtime-linux-x86_64.tar.gz
            aeloon-runtime-linux-x86_64.tar.zst
          )
          mapfile -t actual < <(find "$asset_dir" -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${wanted[*]}" ]]

          issues_json="$RUNNER_TEMP/runtime-public-issues.json"
          previous_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" == "$tag" ]]; then
              break
            fi
            previous_tag="$candidate"
          done < <(
            {
              gh api 'repos/AetherHeart-AI/aeloon-lite/releases?per_page=100' \
                --jq '.[] | .tag_name | select(startswith("runtime-v"))'
              printf '%s\n' "$tag"
            } | sort -Vu
          )
          if [[ -n "$previous_tag" ]]; then
            previous_commit="$(gh api \
              "repos/AetherHeart-AI/aeloon-lite-runtime/commits/$previous_tag" --jq .sha)"
            ISSUE_GH_TOKEN="$ISSUE_GH_TOKEN" python3 tools/issue_flow.py collect \
              --range AetherHeart-AI/aeloon-lite-runtime "$previous_commit" "$SOURCE_COMMIT" \
              --output "$issues_json"
          else
            printf '[]\n' > "$issues_json"
          fi
          issues_markdown="$RUNNER_TEMP/runtime-public-issues.md"
          jq -r '
            if length == 0 then
              "- 暂无已完成的公开 Issue / No completed public Issues."
            else
              .[] | "- [#\(.number)](\(.url)): \(.title)"
            end
          ' "$issues_json" > "$issues_markdown"
          notes="$RUNNER_TEMP/runtime-release-notes.md"
          {
            cat <<EOF
          ## 中文

          Runtime \`$VERSION\` 的公开 SSH 部署资产。

          ### 已完成的公开 Issue
          EOF
            cat "$issues_markdown"
            cat <<EOF

          ## English

          Public SSH deployment assets for Runtime \`$VERSION\`.

          ### Resolved public Issues
          EOF
            cat "$issues_markdown"
            printf '\n'
          } > "$notes"

          if ! gh release view "$tag" --repo AetherHeart-AI/aeloon-lite >/dev/null 2>&1; then
            gh release create "$tag" --repo AetherHeart-AI/aeloon-lite --target main --draft \
              --title "Aeloon Runtime $tag" \
              --notes-file "$notes"
          fi
          gh release edit "$tag" --repo AetherHeart-AI/aeloon-lite --notes-file "$notes"
          if [[ "$(gh release view "$tag" --repo AetherHeart-AI/aeloon-lite --json isDraft --jq .isDraft)" == true ]]; then
            gh release upload "$tag" --repo AetherHeart-AI/aeloon-lite --clobber "$asset_dir"/*
          fi
          mapfile -t published < <(gh release view "$tag" --repo AetherHeart-AI/aeloon-lite \
            --json assets --jq '.assets[].name' | sort)
          [[ "${published[*]}" == "${wanted[*]}" ]]
          gh release edit "$tag" --repo AetherHeart-AI/aeloon-lite --draft=false --latest=false
          ISSUE_GH_TOKEN="$ISSUE_GH_TOKEN" python3 tools/issue_flow.py annotate-release \
            --issues "$issues_json" --tag "$tag" \
            --url "https://github.com/AetherHeart-AI/aeloon-lite/releases/tag/$tag"

      - name: Notify Desktop Runtime-lock workflow
        if: steps.source.outputs.product == 'runtime'
        env:
          GH_TOKEN: ${{ secrets.AELOON_RELEASE_TOKEN }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          gh api --method POST repos/AetherHeart-AI/aeloon-lite-ui/dispatches \
            -f event_type=runtime-release \
            -f "client_payload[release_tag]=runtime-v${VERSION}"
