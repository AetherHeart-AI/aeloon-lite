name: Distribution CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-gate:
    name: Distribution gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the stable installers and publisher
        run: |
          set -euo pipefail
          bash -n tools/publish_release.sh
          python3 -m unittest discover -s tests -v
