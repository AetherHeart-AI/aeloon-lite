name: Distribution CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution-gate:
    name: Distribution gate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the stable installers and publisher
        run: |
          set -euo pipefail
          bash -n tools/publish_release.sh
          python3 -m unittest discover -s tests -v

  windows-installer:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the stable installer
        env:
          AELOON_CHANNEL_FILE: channels/desktop/stable
        run: |
          $ErrorActionPreference = "Stop"
          ./install.ps1 -DownloadOnly "$env:RUNNER_TEMP\dl"
          $version = (Get-Content channels/desktop/stable |
            Where-Object { $_.StartsWith("# version=") }).Substring(10)
          $installer = "$env:RUNNER_TEMP\dl\aeloon-lite-$version-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Missing $installer" }
          "installer=$installer" >> $env:GITHUB_ENV
      - name: Install silently and detect the installation
        env:
          AELOON_CHANNEL_FILE: channels/desktop/stable
        run: |
          $ErrorActionPreference = "Stop"
          $process = Start-Process -FilePath $env:installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with code $($process.ExitCode)." }
          # install.ps1 reports through Write-Host, i.e. the information stream.
          $output = ./install.ps1 -IfInstalled skip 6>&1 | Out-String
          Write-Host $output
          if ($output -notmatch "Keeping the installed aeloon-lite") {
            throw "install.ps1 did not detect the installed aeloon-lite."
          }
      - name: Uninstall and purge
        run: |
          $ErrorActionPreference = "Stop"
          ./uninstall.ps1 -Yes -PurgeData
          $roots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $remaining = @(Get-ItemProperty -Path $roots -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "aeloon-lite" })
          if ($remaining.Count -ne 0) { throw "aeloon-lite is still registered." }
